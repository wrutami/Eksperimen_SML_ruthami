name: Preprocessing Bank Marketing

on:
  push:
    branches: [main]
    paths:
      - "bank_marketing_raw/**"
      - "preprocessing/automate_ruthami.py"
      - "preprocessing/requirements.txt"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: preprocessing/requirements.txt

      - name: Install dependencies
        run: pip install -r preprocessing/requirements.txt

      - name: Run automated preprocessing
        run: python preprocessing/automate_ruthami.py --input bank_marketing_raw/bank-full.csv --output preprocessing/bank_marketing_preprocessing

      - name: Check processed dataset
        run: |
          python - <<'EOF'
          import pandas as pd
          for split in ["train", "test"]:
              df = pd.read_csv(f"preprocessing/bank_marketing_preprocessing/{split}.csv")
              assert df.isna().sum().sum() == 0, f"{split}: ada nilai kosong"
              assert set(df["y"].unique()) <= {0, 1}, f"{split}: label tidak valid"
              print(split, df.shape, "proporsi y =", round(df["y"].mean(), 4))
          EOF

      - name: Upload processed dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank_marketing_preprocessing
          path: preprocessing/bank_marketing_preprocessing/

      - name: Commit updated processed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/bank_marketing_preprocessing
          if git diff --cached --quiet; then
            echo "Dataset hasil preprocessing tidak berubah."
          else
            git commit -m "Perbarui dataset hasil preprocessing otomatis [skip ci]"
            git push
          fi
